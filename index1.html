<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #fff;
    }
    .container {
      display: flex;
      padding: 20px;
    }
    .left-panel {
      flex: 1;
      padding: 40px 20px;
    }
    .left-panel h1 {
      font-size: 50px;
      line-height: 60px;
      color: #8ab4f8;
    }
    .left-panel h1 span {
      color: #fff;
    }
    .left-panel p {
      margin-top: 10px;
      font-size: 18px;
    }
    .left-panel .profile {
      display: flex;
      align-items: center;
      margin-top: 30px;
    }
    .profile img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-right: 15px;
    }
    .save-btn {
      margin-top: 20px;
      padding: 12px 30px;
      border: none;
      background: #1f1f1f;
      color: #fff;
      border-radius: 25px;
      cursor: pointer;
    }
    .right-panel {
      flex: 2;
      background: #121212;
      border-radius: 20px;
      padding: 20px;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .dashboard-header h2 {
      font-size: 24px;
    }
    .dashboard-header input {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
    }
    .date-time-box {
      background: #1f1f1f;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }
    .date-time-box h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    .date-time-box p {
      color: #aaa;
      margin-bottom: 8px;
    }
    .adv-btn {
      background: #2962ff;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: #1f1f1f;
      padding: 20px;
      border-radius: 15px;
    }
    .card h3 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .card p {
      color: #aaa;
    }
    .chart {
      background: #1f1f1f;
      padding: 20px;
      border-radius: 15px;
      margin-top: 30px;
    }
    .chart h3 {
      margin-bottom: 10px;
    }
    .chart img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h1>ATTENDANCE <br><span>DASHBOARD</span></h1>
      <p>DASHBOARD UI<br>Light & Dark Mode</p>
      <div class="profile">
        <img src="c:\Users\DELL\OneDrive\Pictures\pandit.jpeg" alt="Profile">
      </div>
      <button class="save-btn">SAVE</button>
    </div>

    <div class="right-panel">
      <div class="dashboard-header">
        <h2>Dashboard</h2>
        <input type="text" placeholder="Quick Search...">
      </div>

      <div class="date-time-box">
        <h3> 8:02:09 AM</h3>
        <p>Today: 2nd August 2023</p>
        <button class="adv-btn">Advanced Configuration</button>
      </div>

      <div class="stats">
        <div class="card">
          <h3>452</h3>
          <p>Total Employees</p>
        </div>
        <div class="card">
          <h3>360</h3>
          <p>On Time</p>
        </div>
        <div class="card">
            <h3>30</h3>
            <p> Absent </p>
          </div>
          <div class="card">
            <h3>62</h3>
            <p>Late Arrival</p>
          </div>
          <div class="card">
            <h3>6</h3>
            <p>Early Departures</p>
          </div>
          <div class="card">
            <h3>360</h3>
            <p>Time Off </p>
          </div>
      </div>

      <div class="chart">
        <h3>Attendance Comparison Chart</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2bNpcpkwWna0vkxr5xEPD74UdEW_MuKRH_WaE6oaib55sw_lnhS9BXzo&s=10" alt="Chart">
      </div>
    </div>
  </div>
</body>
</html>
